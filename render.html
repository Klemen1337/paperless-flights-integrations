<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="paperless:epd-optimize"
      content='{"intent":"readable","palette":"spectra6OriginalPalette","canvasDitherOptions":{"ditheringType":"errorDiffusion"}}'
    />
    <title>Flights Overhead</title>
    <link rel="stylesheet" href="./assets/paperless.css" />
    <style>
      /* Latin Extended (č, š, ž, ł, ő …) for place names and labels. */
      @font-face { font-family: "Paperless Open Sans"; font-weight: 400; font-display: block; src: url("./assets/fonts/open-sans-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Paperless Open Sans"; font-weight: 600; font-display: block; src: url("./assets/fonts/open-sans-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Paperless Open Sans"; font-weight: 700; font-display: block; src: url("./assets/fonts/open-sans-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Paperless Open Sans"; font-weight: 800; font-display: block; src: url("./assets/fonts/open-sans-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

      /* One design unit: 1px on the 7" panel, about 1.7px on the L panel. */
      #app {
        --u: calc(0.52px + min(100vw, 100vh) / 1000);
        /* Type scale; the map labels in render.js use the same steps. */
        --fs-1: calc(var(--u) * 17); /* flight number, title */
        --fs-2: calc(var(--u) * 13); /* details, badges */
        --fs-3: calc(var(--u) * 11); /* header, small labels */
        --fs-4: calc(var(--u) * 7.5); /* photo credit */
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        display: grid;
        overflow: hidden;
      }

      header {
        grid-area: head;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: calc(var(--u) * 10);
        padding: calc(var(--u) * 6) calc(var(--u) * 14);
        border-bottom: calc(var(--u) * 2) solid var(--pp-fg);
        min-width: 0;
      }
      header .where { min-width: 0; }
      header h1 {
        margin: 0;
        font-size: var(--fs-1);
        line-height: 1.15;
        letter-spacing: -0.01em;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .place {
        margin: 0;
        font-size: var(--fs-3);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .meta {
        text-align: right;
        font-size: var(--fs-3);
        line-height: 1.2;
        white-space: nowrap;
        flex-shrink: 0;
      }
      header .meta strong { font-weight: 800; }
      header .meta > span { display: block; }
      .sample-flag {
        display: inline-block;
        background: var(--pp-fg);
        color: var(--pp-bg);
        font-weight: 800;
        padding: 0 calc(var(--u) * 4);
        margin-bottom: calc(var(--u) * 1);
      }

      .settings-flag {
        display: inline-block;
        background: var(--pp-red);
        color: var(--pp-white);
        font-weight: 800;
        padding: 0 calc(var(--u) * 4);
        margin-bottom: calc(var(--u) * 1);
      }

      #map-wrap {
        grid-area: map;
        position: relative;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #map text { font-family: var(--pp-font); }
      .map-note {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 80%;
        background: var(--pp-bg);
        border: calc(var(--u) * 3) solid var(--pp-fg);
        padding: calc(var(--u) * 10) calc(var(--u) * 14);
        text-align: center;
        font-size: var(--fs-2);
        line-height: 1.3;
      }
      .map-note strong { display: block; font-size: var(--fs-1); }
      .map-note.error { border-color: var(--pp-red); }

      #list-wrap {
        grid-area: list;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: calc(var(--u) * 6) calc(var(--u) * 14) calc(var(--u) * 6);
        overflow: hidden;
      }
      #flights {
        list-style: none;
        margin: 0;
        padding: 0;
        min-height: 0;
        overflow: hidden;
        flex: 0 1 auto;
      }
      .flight {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas: "badge main";
        column-gap: calc(var(--u) * 10);
        align-items: center;
        padding: calc(var(--u) * 7) 0;
        border-bottom: calc(var(--u) * 1) solid var(--pp-border);
      }
      .flight:last-child { border-bottom: 0; }
      .badge {
        grid-area: badge;
        align-self: start;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--u) * 26);
        height: calc(var(--u) * 26);
        border-radius: 50%;
        background: var(--pp-accent);
        color: var(--pp-bg);
        font-weight: 800;
        font-size: var(--fs-2);
        margin-top: calc(var(--u) * 2);
      }
      /* Plane picture with the number badge on its top-left corner. */
      .tile {
        grid-area: badge;
        align-self: center;
        position: relative;
        display: block;
        box-sizing: border-box;
        width: calc(var(--u) * 84);
        height: calc(var(--u) * 56);
        background: var(--pp-bg);
        overflow: visible;
      }
      .flight.with-tile { padding-left: calc(var(--u) * 5); }
      .tile img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: calc(var(--u) * 5); }
      /* No photo: the silhouette sits in a thin rounded frame of the same size. */
      .tile:not(.photo), .tile.failed { box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--pp-border); border-radius: calc(var(--u) * 5); }
      .tile:not(.photo) svg, .tile.failed svg { padding: 12%; box-sizing: border-box; }
      .tile.failed img, .tile.failed .credit { display: none; }
      .tile svg { display: block; width: 100%; height: 100%; }
      .tile .badge {
        position: absolute;
        top: calc(var(--u) * -6);
        left: calc(var(--u) * -6);
        margin: 0;
        width: calc(var(--u) * 22);
        height: calc(var(--u) * 22);
        font-size: var(--fs-2);
        outline: calc(var(--u) * 2) solid var(--pp-bg);
      }
      .badge { box-sizing: border-box; }
      .badge.badge-square { border-radius: 22%; }
      .badge.two-digit { font-size: var(--fs-3); letter-spacing: -0.03em; }
      .tile .credit {
        position: absolute;
        right: 0;
        bottom: 0;
        max-width: 100%;
        padding: 0 calc(var(--u) * 3);
        border-radius: calc(var(--u) * 4) 0 calc(var(--u) * 5) 0;
        background: var(--pp-bg);
        color: var(--pp-fg);
        font-size: var(--fs-4);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-sizing: border-box;
      }
      .main { grid-area: main; min-width: 0; }
      .line1 {
        display: flex;
        align-items: baseline;
        gap: calc(var(--u) * 8);
        min-width: 0;
      }
      .cs {
        font-size: var(--fs-1);
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .line2 {
        margin-top: calc(var(--u) * 1);
        font-size: var(--fs-2);
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .line2 .arrow { width: 1.25em; height: 0.5em; vertical-align: 0.12em; margin: 0 0.3em; color: var(--pp-accent); }
      .emergency {
        background: var(--pp-red);
        color: var(--pp-white);
        font-weight: 800;
        padding: 0 calc(var(--u) * 4);
        font-size: var(--fs-3);
      }
      /* ---------- portrait: header, map, list ---------- */
      @media (orientation: portrait) {
        #app {
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas: "head" "map" "list";
        }
        #map-wrap {
          border-bottom: calc(var(--u) * 2) solid var(--pp-fg);
        }
        #list-wrap {
          max-height: 38vh;
        }
        #list-wrap:has(#flights.two-col) {
          max-height: 44vh;
        }
      }

      /* ---------- landscape: map left, header and list right ---------- */
      @media (orientation: landscape) {
        #app {
          grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          grid-template-areas: "map head" "map list";
        }
        #map-wrap {
          border-right: calc(var(--u) * 2) solid var(--pp-fg);
        }
        .tile { width: calc(var(--u) * 72); height: calc(var(--u) * 48); }
        header {
          flex-direction: column;
          align-items: stretch;
          gap: calc(var(--u) * 2);
        }
        header .meta {
          text-align: left;
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 0 calc(var(--u) * 8);
        }
        header .meta > span { display: inline; }
      }

      /* ---------- two columns when the list is wide enough (set in render.js) ---------- */
      #flights.two-col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: calc(var(--u) * 16);
        align-content: start;
      }
      /* Thin rule down the middle of the two columns. */
      #flights.two-col {
        background: linear-gradient(var(--pp-border), var(--pp-border)) center / calc(var(--u) * 1) calc(100% - var(--u) * 16) no-repeat;
      }
      #flights.two-col .flight { column-gap: calc(var(--u) * 8); padding: calc(var(--u) * 6) 0; }
      #flights.two-col .flight.with-tile { padding-left: calc(var(--u) * 5); }
      #flights.two-col .line1 { gap: calc(var(--u) * 6); }
      /* Two columns are narrower: one step down, same proportions. */
      #flights.two-col { --fs-1: calc(var(--u) * 15); --fs-2: calc(var(--u) * 12); --fs-4: calc(var(--u) * 6.5); }
      #flights.two-col .tile { width: calc(var(--u) * 60); height: calc(var(--u) * 40); }
      #flights.two-col .flight:nth-last-child(2):nth-child(odd) { border-bottom: 0; }

      .empty {
        padding: calc(var(--u) * 12) 0;
        font-size: var(--fs-2);
        line-height: 1.35;
      }
      .empty strong { display: block; font-size: var(--fs-1); }
    </style>
  </head>
  <body>
    <div id="website-has-loading-element"></div>
    <main id="app">
      <header>
        <div class="where">
          <h1 id="title"></h1>
          <p class="place" id="place"></p>
        </div>
        <div class="meta" id="meta"></div>
      </header>
      <section id="map-wrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Map of nearby aircraft"></svg>
      </section>
      <section id="list-wrap">
        <ol id="flights"></ol>
      </section>
    </main>
    <script type="module" src="./assets/render.js"></script>
  </body>
</html>
